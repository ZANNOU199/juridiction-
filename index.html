<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Systeme de Juridiction Pro | Official Judging System</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FF8C00" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ARENA" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script async defer src="https://accounts.google.com/gsi/client"></script>
    <script>
      // Update PWA manifest and meta tags based on current path
      (function() {
        const pathname = window.location.pathname;
        
        // Update apple-mobile-web-app-title based on route
        let appTitle = "ARENA";
        if (pathname.startsWith("/jury")) {
          appTitle = "JURY";
          document.title = "Jury Console";
        } else if (pathname.startsWith("/admin")) {
          appTitle = "ADMIN";
          document.title = "Admin Console";
        }
        
        // Update the apple-mobile-web-app-title meta tag
        let metaTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (metaTitle) {
          metaTitle.setAttribute("content", appTitle);
        }
        
        // For Safari iOS: use the current pathname as the start URL
        // Safari iOS will use the current page URL when "Add to Home Screen" is used
        // This script ensures the right meta data is in place
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
